<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Who's That Pokémon?</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="pokedex">
  <div class="top-bar">
    <div class="lens"></div>
    <div class="dot red"></div>
    <div class="dot yellow"></div>
    <div class="dot green"></div>
    <div class="title">WHO'S THAT POKÉMON?</div>
  </div>

  <div class="screen">
    <div class="display" id="display">
      <span class="placeholder">LOADING...</span>
    </div>
    <div class="status-line" id="status"></div>

    <form id="guess-form">
      <input type="text" id="guess-input" placeholder="Type a Pokémon name..." autocomplete="off" />
      <button type="submit">Guess</button>
    </form>
    <form id="reveal">
      <button type="button" id="Reveal">Reveal</button>
    </form>

    <div class="controls">
      <span class="score" id="score">Score: 0</span>
      <button class="next-btn" id="next-btn">Skip / Next →</button>
    </div>
  </div>
</div>

<script src="index.js"></script>

</body>
</html>
